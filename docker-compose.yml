services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
  ml:
    build: ./ml-service
    ports: ["8000:8000"]
  api:
    build: ./api
    environment:
      MONGO_URL: mongodb://mongo:27017/support
      ML_URL: http://ml:8000
      JWT_SECRET: change-me
    depends_on: [mongo, ml]
    restart: on-failure
    ports: ["4000:4000"]
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  mongo-data:
